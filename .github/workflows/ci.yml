name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: check (go ${{ matrix.go }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        go: ["1.23.x", "stable"] # the go.mod floor and the latest release
    steps:
      # Actions are pinned by commit, which a moved tag cannot change;
      # Dependabot keeps the pins current.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: ${{ matrix.go }}
          # setup-go keys its cache on go.sum by default; the modules have
          # none until their siblings are released, so key on every go.mod.
          cache-dependency-path: "**/go.mod"
      # bgpq4 1.16, built from its release commit: the differential tests
      # hold rpslq's output to this version's byte for byte, and the
      # distribution's package is older (Ubuntu 24.04 ships 1.12, whose
      # Arista and IOS XR output differs).
      - name: Build bgpq4 1.16 (for the differential tests)
        run: |
          sudo apt-get update && sudo apt-get install -y autoconf automake
          git clone --quiet --depth 1 --branch 1.16 https://github.com/bgp/bgpq4.git "$RUNNER_TEMP/bgpq4"
          cd "$RUNNER_TEMP/bgpq4"
          test "$(git rev-parse HEAD)" = 28232089197ab4582d99da1c3b048259d3dbef70
          ./bootstrap >/dev/null && ./configure --quiet && make --quiet && sudo make install >/dev/null
          bgpq4 -v
      # BIRD 2, for "bird -p": every BIRD configuration the rtconfig tests
      # write must parse (cfgsim.BIRDSyntax skips when bird is absent).
      - name: Install BIRD 2
        run: sudo apt-get install -y bird2 && command -v bird
      # IRRToolSet 5.1.3's rtconfig and peval, for the rtconfig and peval
      # differentials. There is no package, and only a -O0 source build
      # works; the build is cached on the script that makes it.
      - name: Install IRRToolSet's build and run dependencies
        run: sudo apt-get install -y build-essential autoconf automake libtool bison flex pkgconf libreadline-dev
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: irrtoolset
        with:
          path: ~/.cache/irrtoolset-5.1.3
          key: irrtoolset-5.1.3-${{ runner.os }}-${{ hashFiles('scripts/build-irrtoolset.sh') }}
      - name: Build IRRToolSet 5.1.3
        if: steps.irrtoolset.outputs.cache-hit != 'true'
        run: scripts/build-irrtoolset.sh
      - name: Put IRRToolSet on PATH
        run: echo "$HOME/.cache/irrtoolset-5.1.3/bin" >> "$GITHUB_PATH"
      - name: Install staticcheck and govulncheck
        if: matrix.go == 'stable'
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@v0.8.1   # 2026.2.1
          go install golang.org/x/vuln/cmd/govulncheck@v1.8.0
      - name: scripts/check.sh
        run: scripts/check.sh
        env:
          FUZZTIME: ${{ matrix.go == 'stable' && '15s' || '' }}
